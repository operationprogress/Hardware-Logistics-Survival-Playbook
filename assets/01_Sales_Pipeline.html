        map.addSource('rdc-points', {
            type: 'geojson',
            data: geoData
        });

        map.addLayer({
            id: 'rdc-circles',
            type: 'circle',
            source: 'rdc-points',
            paint: {
                'circle-radius': ['get', 'marker-size'],
                'circle-color': ['get', 'marker-color'],
                'circle-opacity': 0.8,
                'circle-stroke-width': 1,
                'circle-stroke-color': '#ffffff'
            }
        });

        const popup = new maplibregl.Popup({
            closeButton: false,
            closeOnClick: false
        });

        map.on('mouseenter', 'rdc-circles', (e) => {
            map.getCanvas().style.cursor = 'pointer';
            const feature = e.features[0];
            const props = feature.properties;
            const coordinates = feature.geometry.coordinates.slice();
            
            // 弹窗直接读取 props.customer，只显示 A, B, C 代号
            const html = `
                <div class="popup-content">
                    <strong>RDC ID:</strong> ${props.id}<br>
                    <strong>Customer:</strong> ${props.customer}<br>
                    <strong>ZIP5:</strong> ${props.zip}<br>
                    <strong>Demand:</strong> <span style="color: #ef4444; font-weight:bold;">${props.demand} units</span> <br>
                    <strong>Deployment Duration:</strong> ${props.duration} weeks 
                </div>
            `;
            
            popup.setLngLat(coordinates).setHTML(html).addTo(map);
        });

        map.on('mouseleave', 'rdc-circles', () => {
            map.getCanvas().style.cursor = '';
            popup.remove();
        });
